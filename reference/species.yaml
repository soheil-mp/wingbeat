# Wingbeat species reference table. Schema: reference/species.schema.json.
# Every value cites a source and a locator inside it. Unknown values stay unknown; never estimate.
# Values were checked against the full text of each source; see docs/research/science.md.
schema_version: 1
table_version: "0.2.0"
reference_temperature_c: 20.0

sources:
  kim2021:
    citation: >-
      Kim D, DeBriere TJ, Cherukumalli S, White GS, Burkett-Cadena ND (2021). Infrared light
      sensors permit rapid recording of wingbeat frequency and bioacoustic species identification
      of mosquitoes. Scientific Reports 11:10042.
    doi: 10.1038/s41598-021-89644-z
  cator2009:
    citation: >-
      Cator LJ, Arthur BJ, Harrington LC, Hoy RR (2009). Harmonic convergence in the love songs of
      the dengue vector mosquito. Science 323:1077-1079.
    doi: 10.1126/science.1166541
  loh2024:
    citation: >-
      Loh YM, Xu YYJ, Lee TT, Ohashi TS, Zhang YD, Eberl DF, Su MP, Kamikouchi A (2024).
      Differences in male Aedes aegypti and Aedes albopictus hearing systems facilitate
      recognition of conspecific female flight tones. iScience 27:110264.
    doi: 10.1016/j.isci.2024.110264
  rajan2025:
    citation: >-
      Rajan P, Goswami D, Vanlalhmuaka, Datta S, Rabha B, Kamboj DV (2025). Acoustic behaviour and
      flight tone frequency changes in adult Aedes albopictus and Culex quinquefasciatus
      mosquitoes. Scientific Reports.
    doi: 10.1038/s41598-025-89608-7
  saha2024:
    citation: >-
      Saha T, Genoud AP, Park JH, Thomas BP (2024). Temperature dependency of insect's wingbeat
      frequencies: an empirical approach to temperature correction. Insects 15:342.
    doi: 10.3390/insects15050342
  villarreal2017:
    citation: >-
      Villarreal SM, Winokur O, Harrington L (2017). The impact of temperature and body size on
      fundamental flight tone variation in the mosquito vector Aedes aegypti. Journal of Medical
      Entomology 54:1116-1121.
    doi: 10.1093/jme/tjx079

temperature_correction:
  default:
    method: frequency-dependent-slope
    source: saha2024
    locator: Eq. 3
    quadratic: -3.605e-5
    linear: 0.0372
    reference_temperature_c: 20.0
    valid_range_c: [10.0, 38.0]

# Kim et al. 2021, Table 1: mated, non-blood-fed females, 3-5 days old, recorded with an infrared
# optical sensor at 23.0 ± 0.5 °C and 60 ± 5 % RH. n is the number of valid files; the table's
# separate sample-size column is given in each note.
species:
  - id: aedes-vexans
    scientific_name: Aedes vexans
    gbif_taxon_key: 1652274
    status: measured
    measurements:
      - &kim2021
        sex: female
        mean_hz: 377.62
        sd_hz: 26.11
        n: 714
        n_unit: valid-files
        modality: optical-infrared
        temperature_c: 23.0
        temperature_tolerance_c: 0.5
        temperature_basis: recording
        relative_humidity_pct: 60
        condition: mated, non-blood-fed, 3-5 days old
        source: kim2021
        locator: Table 1
        note: sample size 21

  - id: aedes-japonicus
    scientific_name: Aedes japonicus
    gbif_taxon_key: 1652212
    status: measured
    measurements:
      - <<: *kim2021
        mean_hz: 383.00
        sd_hz: 37.24
        n: 690
        note: sample size 322

  - id: culex-pipiens
    scientific_name: Culex pipiens
    gbif_taxon_key: 1652991
    status: measured
    measurements:
      - <<: *kim2021
        mean_hz: 408.39
        sd_hz: 41.40
        n: 867
        note: sample size 568

  - id: aedes-albopictus
    scientific_name: Aedes albopictus
    gbif_taxon_key: 1651430
    status: measured
    measurements:
      - <<: *kim2021
        mean_hz: 536.16
        sd_hz: 31.24
        n: 840
        note: sample size 591
      - &rajan2025
        sex: female
        mean_hz: 499.28
        sd_hz: 18.06
        n: 58
        modality: acoustic-microphone
        temperature_c: 27.0
        temperature_tolerance_c: 2.0
        temperature_basis: recording
        relative_humidity_pct: null
        condition: adult, recorded individually (Zoom H1n recorder)
        source: rajan2025
        locator: Table 2
        note: n as reported, unit not stated; RH reported as 70-80 %
      - <<: *rajan2025
        sex: male
        mean_hz: 704.17
        sd_hz: 50.49
        n: 63
      - &loh2024
        sex: female
        mean_hz: 566.5
        sd_hz: 8.4
        n: 15
        n_unit: cages
        modality: acoustic-microphone
        temperature_c: 28.0
        temperature_tolerance_c: 1.0
        temperature_basis: recording
        relative_humidity_pct: null
        condition: virgin, cages of 50, 30 min recordings before lights off on day 3 of entrainment
        source: loh2024
        locator: Table 1
        note: RH 60-70 % during rearing; not reported for the recordings
      - <<: *loh2024
        sex: male
        mean_hz: 921.0
        sd_hz: 31.2
        n: 20
    convergence:
      - band_hz: [1400, 1500]
        description: adult male and female harmonics combine during swarming (male first, female second harmonic)
        source: rajan2025
        locator: Abstract

  - id: aedes-aegypti
    scientific_name: Aedes aegypti
    gbif_taxon_key: 1651891
    status: measured
    measurements:
      - <<: *kim2021
        mean_hz: 498.08
        sd_hz: 34.19
        n: 1161
        note: sample size 509
      - <<: *loh2024
        sex: female
        mean_hz: 531.9
        sd_hz: 13.1
        n: 15
      - <<: *loh2024
        sex: male
        mean_hz: 887.0
        sd_hz: 24.9
        n: 17
    temperature_slopes:
      - sex: female
        min_hz_per_c: 8.0
        max_hz_per_c: 13.0
        source: villarreal2017
        locator: Abstract
    convergence:
      - band_hz: [1200, 1200]
        description: courtship duet matched at a shared harmonic of about 1200 Hz, not at the fundamentals of about 400 Hz (female) and 600 Hz (male)
        source: cator2009
        locator: Abstract

  - id: culex-quinquefasciatus
    scientific_name: Culex quinquefasciatus
    gbif_taxon_key: 1652950
    status: measured
    measurements:
      - <<: *kim2021
        mean_hz: 456.23
        sd_hz: 30.70
        n: 2738
        note: sample size 798
      - <<: *rajan2025
        sex: female
        mean_hz: 414.61
        sd_hz: 18.24
        n: 49
      - <<: *rajan2025
        sex: male
        mean_hz: 533.99
        sd_hz: 33.98
        n: 45
        note: n as reported, unit not stated; RH reported as 70-80 %; the text gives 533.90 Hz, Table 2 gives 533.99 Hz (used here)
    convergence:
      - band_hz: [1400, 1500]
        description: adult male and female harmonics combine during swarming (male first, female second harmonic)
        source: rajan2025
        locator: Abstract


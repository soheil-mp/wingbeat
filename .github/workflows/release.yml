name: release

# release-please keeps a release pull request open that collects Conventional Commits into
# CHANGELOG.md and version.txt. Merging that pull request tags vX.Y.Z and publishes the release.
# Requires Settings → Actions → General → "Allow GitHub Actions to create and approve pull
# requests" to be enabled.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request and tags
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

[project]
name = "wingbeat-stream-processor"
version = "0.0.0"
description = "Stateful stream processing for Wingbeat: validation, enrichment, attribution, windows and alerts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Soheil" }]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[build-system]
requires = ["uv_build>=0.11.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wingbeat_stream"
